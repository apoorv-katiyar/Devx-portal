---
# GitHub sign-in resolves to this entity via usernameMatchingUserEntityName,
# matching the GitHub login "apoorv-katiyar" to user:default/apoorv-katiyar.
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: apoorv-katiyar
spec:
  memberOf: [platform-team]
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-group
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform-team
  description: Owns the DevX internal developer platform
spec:
  type: team
  children: []
